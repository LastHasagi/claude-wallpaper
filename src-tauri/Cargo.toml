[package]
name = "clawd-pet"
version = "0.5.1"
description = "Clawd, a desktop pet that lives in ASCII scenes"
authors = ["Rodrigo Graça <rodrigo81graca@gmail.com>"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/LastHasagi/claude-wallpaper"
edition = "2021"
rust-version = "1.77"

[lib]
name = "clawd_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Direct dependencies are pinned to releases at least two weeks old (supply-chain hygiene).
[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-updater = "=2.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
