<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clawd</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 36 22%27%3E%3Crect x=%276%27 y=%272%27 width=%2724%27 height=%2716%27 fill=%27%23d77757%27/%3E%3Crect x=%2710%27 y=%276%27 width=%272%27 height=%274%27/%3E%3Crect x=%2724%27 y=%276%27 width=%272%27 height=%274%27/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      body.full { background: #141413; }
      body.full.light { background: #f0eee6; }
      /* Browser preview of overlay mode: a fake desktop behind the transparent engine. */
      body.overlay-preview {
        background:
          radial-gradient(ellipse at 25% 30%, #3a5bd0 0%, transparent 55%),
          radial-gradient(ellipse at 80% 70%, #7a3fb8 0%, transparent 55%),
          #1b2350;
      }
      body.overlay-preview::after {
        content: ''; position: fixed; left: 0; right: 0; bottom: 0; height: 48px;
        background: rgba(16, 16, 22, 0.92);
      }
      #stage { position: fixed; inset: 0; z-index: 1; }
      #stage canvas { position: absolute; left: 0; top: 0; }
      #debug {
        position: fixed; right: 8px; top: 8px; z-index: 2; margin: 0; padding: 6px 8px;
        font: 11px/1.35 Consolas, monospace; color: #e6e0d3; background: rgba(0, 0, 0, 0.7);
        border-radius: 4px; pointer-events: none; white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="bg"></canvas><canvas id="fg"></canvas></div>
    <pre id="debug" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
